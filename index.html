function help(back='menu'){state=back==='pause'?'paused':'help';screen.innerHTML=`<section class="dialog"><div class="row spread"><span class="eyebrow">FLIGHT MANUAL</span>${btn('返回',back,'small')}</div><h2>飛行與整備手冊</h2><div class="grid two"><article class="panel"><h3>操控</h3><p><span class="key">WASD / ↑↓←→</span> 移動<br><span class="key">Z / Space</span> 射擊（預設自動射擊）<br><span class="key">Shift</span> 衝刺，消耗 35 能量，短暫無敵<br><span class="key">C</span> 超載，消耗 70 能量，提升速度與射速<br><span class="key">X</span> 大招，清除敵彈；冷卻 30 秒<br><span class="key">Q / E</span> 切換戰翼，安裝需 0.6 秒<br><span class="key">P / Esc</span> 暫停</p><p class="muted">可在設定重新綁定。滑鼠模式：移動指標控制戰機，左鍵射擊，右鍵大招。Alt 等系統保留快捷鍵仍可能由瀏覽器攔截。</p></article><article class="panel"><h3>戰場判斷</h3><p>白色機心是本體命中區；戰翼與子機有獨立耐久。藍青色為己方火力，粉紅色為敌方實彈。</p><p>運輸機攜帶可回收戰翼。護盾母機的護衛未清除前，本體減傷。Boss 護盾發生器被破壞後，核心才承受完整傷害。</p><p>雷射的紅色預警航道會鎖定位置，請在發射前移出。受損 Boss 會切換階段，拆掉砲翼可降低彈幕壓力。</p><h3>整備</h3><p>關卡結束獲得固定報酬、拆件與表現獎金。修理、改裝、備用戰翼共用本局金錢。死亡清空本局金錢，可從已解鎖關卡重新出擊。</p></article></div></section>`}

screen.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled){binding=null;action(t.dataset.act)}});$('#pauseBtn').addEventListener('click',pause);
// ---------- Input / lifecycle ----------
window.addEventListener('keydown',e=>{if(binding){e.preventDefault();if(['Escape','KeyP','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)){toast('此按鍵保留為全域快捷鍵，請選其他鍵');return}const old=prefs.keys[binding],other=Object.keys(prefs.keys).find(k=>k!==binding&&prefs.keys[k]===e.code);if(other){prefs.keys[other]=old;$('#bind-'+other).textContent=old}prefs.keys[binding]=e.code;$('#bind-'+binding).textContent=e.code;binding=null;save();return}if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement)return;const controlled=Object.values(prefs.keys).includes(e.code)||['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Escape','KeyP'].includes(e.code);if(controlled)e.preventDefault();if(e.repeat)return;keys.add(e.code);if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='paused')action('resume');return}if(state!=='play')return;if(e.code===prefs.keys.nova)nova();if(e.code===prefs.keys.dash||e.code==='ShiftRight'&&prefs.keys.dash==='ShiftLeft')dash();if(e.code===prefs.keys.prev)swapWing(-1);if(e.code===prefs.keys.next)swapWing(1);if(e.code===prefs.keys.over)overdrive()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();pointer.down=false;if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();pointer.x=clamp((e.clientX-r.left)*W/r.width,L+33,R-33);pointer.y=clamp((e.clientY-r.top)*H/r.height,TOP+40,BOTTOM-20);pointer.valid=true});cv.addEventListener('pointerdown',e=>{unlockAudio();if(e.button===2)nova();else pointer.down=true});window.addEventListener('pointerup',()=>pointer.down=false);cv.addEventListener('contextmenu',e=>e.preventDefault());
let accumulator=0;
function loop(now){const dt=Math.min(.25,(now-last)/1000||.016);last=now;if(!['paused','help','settings','result','over','complete'].includes(state)){visualTime+=dt;if(state!=='play'&&state!=='dying')bgScroll+=dt*25}if(state==='play'||state==='dying'){accumulator+=dt;while(accumulator>=1/120){update(1/120);accumulator-=1/120}}else accumulator=0;render();requestAnimationFrame(loop)}
window.addEventListener('error',e=>{const box=$('#fatal');box.style.display='block';box.textContent='遊戲發生錯誤：'+e.message+'。請重新開啟檔案。'});
mainMenu();requestAnimationFrame(loop);
</script></body></html>
